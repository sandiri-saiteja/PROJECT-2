          href="css/style.css">

        🌿 EcoEnergy

<section class="form-page">

<div class="form-container">

<h1>

Consumer Login

</h1>

<form id="loginForm">
    <div class="input-group">

<label for="loginEmail">

Email Address

</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required>

</div>


<div class="input-group">

<label for="loginPassword">

Password

</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

</div>


<div class="checkbox-group">

<input
type="checkbox"
id="remember">

<label for="remember">

Remember Me

</label>

</div>


<button type="submit">

Login

</button>


<div class="form-links">

<p>

Don't have an account?

<a href="register.html">

Register Here

</a>

</p>

</div>

</form>

</div>

</section>
<footer>

<div class="footer-bottom">

<p>

© 2026 Renewable Energy Optimization System

</p>

</div>

</footer>
