<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Consumer Registration</title>

    <link rel="stylesheet"
          href="css/style.css">

    <script src="js/script.js" defer></script>

</head>

<body>

<nav>

    <div class="logo">

        🌿 EcoEnergy

    </div>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="register.html">Register</a></li>

        <li><a href="login.html">Login</a></li>

        <li><a href="catalog.html">Catalog</a></li>

        <li><a href="usage.html">Usage</a></li>

    </ul>

</nav>


<section class="form-page">

<div class="form-container">

<h1>

Consumer Registration

</h1>

<form id="registerForm">
    <div class="form-row">

<div class="input-group">

<label for="name">

Full Name

</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

</div>

<div class="input-group">

<label for="phone">

Phone Number

</label>

<input
type="tel"
id="phone"
placeholder="Enter phone number"
required>

</div>

</div>


<div class="form-row">

<div class="input-group">

<label for="email">

Email Address

</label>

<input
type="email"
id="email"
placeholder="Enter email"
required>

</div>

<div class="input-group">

<label for="password">

Password

</label>

<input
type="password"
id="password"
placeholder="Create password"
required>

</div>

</div>
<div class="input-group">

<label for="address">

Address

</label>

<textarea
id="address"
placeholder="Enter your address"></textarea>

</div>


<div class="form-row">

<div class="input-group">

<label for="resource">

Preferred Energy Source

</label>

<select id="resource">

<option>Solar Energy</option>

<option>Wind Energy</option>

<option>Hydroelectric Energy</option>

<option>Biomass Energy</option>

<option>Geothermal Energy</option>

<option>Tidal Energy</option>

</select>

</div>

<div class="input-group">

<label for="usage">

Monthly Energy Usage (kWh)

</label>

<input
type="number"
id="usage"
placeholder="Example: 450">

</div>

</div>
<div class="checkbox-group">

<input
type="checkbox"
id="terms"
required>

<label for="terms">

I agree to the Terms & Conditions

</label>

</div>


<button type="submit">

Register

</button>

<div class="form-links">

Already have an account?

<a href="login.html">

Login Here

</a>

</div>

</form>

</div>

</section>


<footer>

<div class="footer-bottom">

<p>

© 2026 Renewable Energy Optimization System

</p>

</div>

</footer>

</body>

</html>
